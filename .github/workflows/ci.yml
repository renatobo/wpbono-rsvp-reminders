name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: PHP ${{ matrix.php }} syntax and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint runtime PHP
        run: find . -path './vendor' -prune -o -path './tests' -prune -o -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run scheduling regression tests
        run: php tests/scheduler.php
      - name: Check package builder
        run: |
          bash -n build.sh
          bash build.sh
      - name: Inspect installable package
        run: python3 .github/scripts/check-package.py

  ci-required:
    name: ci-required
    if: always()
    needs: [runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PYTHON
