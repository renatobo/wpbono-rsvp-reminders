<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="WPBono RSVP Reminders">
  <defs>
    <linearGradient id="rsvpRemindersBg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11C24"/>
      <stop offset="1" stop-color="#8C0F16"/>
    </linearGradient>
    <linearGradient id="rsvpRemindersCard" x1="120" y1="150" x2="392" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F3F5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#F6F7F7"/>
  <rect x="64" y="64" width="384" height="384" rx="88" fill="url(#rsvpRemindersBg)"/>

  <!-- The reminder itself: an envelope. -->
  <rect x="118" y="150" width="276" height="188" rx="26" fill="url(#rsvpRemindersCard)"/>
  <path d="M118 186 L256 282 L394 186" stroke="#E11C24" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Scheduled, not immediate: a clock, riding over the corner. -->
  <circle cx="368" cy="356" r="82" fill="#7A0D13"/>
  <circle cx="368" cy="356" r="66" fill="#FFFFFF"/>
  <path d="M368 314 V356 L398 374" stroke="#E11C24" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
